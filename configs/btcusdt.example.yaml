exchange:
  env: testnet
  ws_api_url_mainnet: wss://ws-api.binance.com:443/ws-api/v3
  ws_api_url_testnet: wss://ws-api.testnet.binance.vision/ws-api/v3
  user_stream_url_mainnet: wss://stream.binance.com:9443/ws
  user_stream_url_testnet: wss://stream.testnet.binance.vision:9443/ws
  rest_url_mainnet: https://api.binance.com
  rest_url_testnet: https://testnet.binance.vision
  api_key_env: BINANCE_API_KEY
  secret_key_env: BINANCE_SECRET_KEY
  recv_window_ms: 5000

bot:
  symbol: BTCUSDT
  base_asset: BTC
  quote_asset: USDT
  total_capital_quote: "200"
  order_quote_value: "20"
  target_net_profit_per_cycle_quote: "0.10"
  grid_type: geometric
  inventory_mode: prebalanced
  buy_allocation_ratio: "0.5"
  quote_reserve_pct: "0.02"
  base_reserve_pct: "0.02"
  order_type: LIMIT_MAKER
  time_in_force: GTC
  max_grid_levels: 20
  max_grid_step_pct: "0.05"  # sanity check: ha számolt step >5% → bot leáll

fees:
  fee_mode: maker_assumed
  maker_fee_buy: "0.001"
  maker_fee_sell: "0.001"
  taker_fee_buy: "0.001"
  taker_fee_sell: "0.001"

anchor:
  source: best_bid_ask_mid  # induláskor az aktuális bid/ask közép lesz az anchor
  # manual_price: "95000"   # csak source: manual esetén szükséges

safety:
  external_intervention_policy: pause
  max_user_stream_staleness_sec: 120
  max_trading_ws_staleness_sec: 30
  cancel_retry_interval_sec: 2
  cancel_retry_max: 5
  emergency_stop_on_db_queue_full: true
  emergency_stop_on_balance_mismatch: true
  sell_on_emergency_stop: false
  reconciliation_interval_sec: 60

database:
  # DB kapcsolati adatok az .env fájlból jönnek (DB_HOST, DB_PORT, DB_NAME, DB_USER, DATABASE_PASSWORD)
  pool_min_size: 1
  pool_max_size: 10
  writer_queue_max_size: 10000

logging:
  level: INFO
  json_format: true
