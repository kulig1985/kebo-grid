exchange:
  env: testnet                   # testnet | mainnet
  ws_api_url_mainnet: wss://ws-api.binance.com:443/ws-api/v3
  ws_api_url_testnet: wss://ws-api.testnet.binance.vision/ws-api/v3
  user_stream_url_mainnet: wss://stream.binance.com:9443/ws
  user_stream_url_testnet: wss://stream.testnet.binance.vision:9443/ws
  rest_url_mainnet: https://api.binance.com
  rest_url_testnet: https://testnet.binance.vision
  api_key_env: BINANCE_API_KEY   # env var neve (a kulcs a .env fájlban van)
  secret_key_env: BINANCE_SECRET_KEY
  recv_window_ms: 5000

bot:
  symbol: SOLUSDT
  base_asset: SOL
  quote_asset: USDT

  total_capital_quote: "50"
  # ▶ A bot által kezelt összes tőke USDT-ben.
  # Ebből vonjuk le a tartalékot, és ez osztódik szét a grid szintek között.

  # order_quote_value: "2.5"
  # ▶ OPCIONÁLIS – ha nem adod meg, a rendszer automatikusan kiszámolja:
  #     order_quote_value = total_capital × (1 - tartalék%) / max_grid_levels
  #     pl. 50 × 0.98 / 20 = 2.45 USDT / szint
  # Ha megadod: a rendszer ellenőrzi, hogy belefér-e a tőkébe.
  # HIBA, ha: order_quote_value ≥ total_capital_quote (pl. 100 és 50)

  target_net_profit_per_cycle_quote: "0.02"
  # ▶ Minimálisan elvárt NETTÓ profit egy buy-sell körön (USDT).
  # Ebből számolja a rendszer a szükséges lépésközt – de ELTÉRŐEN a két grid típusnál:
  #
  # GEOMETRIC grid_type esetén:
  #   Képlet: r = (1 + fee_buy + profit/order_value) / (1 - fee_sell)
  #   A lépés %-os → minden szinten AZONOS a profit (mindig pontosan ≥ 0.02 USDT)
  #   Példa: 2.45 USDT/order, 0.1% díj → r ≈ 1.009 (0.9% lépés)
  #
  # ARITHMETIC grid_type esetén:
  #   Képlet: d = anchor_price × (r - 1), ahol r ugyanaz a képletből
  #   A lépés fix USDT összeg → a % szintenként VÁLTOZIK (mélyebb szinten nagyobb %)
  #   Garantált minimum: a legmagasabb buy szintnél (anchor közelében) is ≥ 0.02 USDT
  #   Mélyebb szinteken a profit magasabb, mert ugyanaz a d-USDT kisebb árnál nagyobb %
  #   Tehát: 0.02 USDT MINIMUM, alacsonyabb áron több profit/ciklus
  #
  # Ha növeled: ritkább szintek, nagyobb profit körvonként, kevesebb kötés
  # Ha csökkented: sűrűbb szintek, kisebb profit körvonként, több kötés

  grid_type: geometric
  # geometric:   lépés %-os → minden szinten azonos profit/ciklus (ajánlott)
  # arithmetic:  lépés fix USDT → profit szintenként változik (mélyebben több)

  inventory_mode: prebalanced
  # prebalanced:          van meglévő SOL-od, azt használja sell order-ekhez
  # use_existing_balances: hasonló, meglévő egyenleget használja
  # quote_only_bootstrap: csak USDT-d van → először vásárol SOL-t (ld. bootstrap szekció)

  buy_allocation_ratio: "0.5"
  # A szintek hány %-a legyen buy oldal. 0.5 = 50-50.
  # 0.6 → több buy szint, kevesebb sell szint (ha inkább esésre számítasz)

  quote_reserve_pct: "0.02"     # USDT egyenleg 2%-a tartalékban marad
  base_reserve_pct: "0.02"      # SOL egyenleg 2%-a tartalékban marad

  order_type: LIMIT_MAKER
  # LIMIT_MAKER (ajánlott): post-only, csak maker díjat fizet
  #   Ha az ár azonnal teljesítené → Binance visszautasítja (nem piaci ár)
  # LIMIT: hagyományos limit, taker-ként is teljesülhet

  time_in_force: GTC            # Good Till Canceled

  max_grid_levels: 20
  # Maximum grid szintek száma összesen (buy + sell).
  # Ha nincs megadva order_quote_value: ez határozza meg egy szint méretét is.

  min_grid_step_pct: "0.0025"
  # ▶ BIZTONSÁGI ALSÓ KORLÁT – nem a tényleges lépés!
  # Ha a számított lépés kisebb lenne ennél (0.25%), ez az érték lép életbe.
  # Célja: megakadályozni a túl szoros gridekat ahol slippage eliminálja a profitot.

  max_grid_step_pct: "0.05"
  # ▶ BIZTONSÁGI FELSŐ KORLÁT – ha a számított lépés meghaladja ezt (5%),
  # a bot HIBÁVAL ÁLL LE induláskor. Valószínűleg elírás van a konfigban.

bootstrap:
  # Csak inventory_mode: quote_only_bootstrap esetén aktív
  order_type: MARKET
  # MARKET: azonnali végrehajtás (taker díj, de azonnal benne van a piacban)
  # LIMIT:  limit áron, limit_price_offset_pct %-kal az anchor alá
  # LIMIT_MAKER: post-only limit (olcsóbb de lassabb belépés)

  # quote_qty: "25"
  # Mennyi USDT-ért vegyen SOL-t a bootstrap lépésben.
  # Ha nem adod meg: automatikus = total_capital × buy_allocation_ratio
  #   pl. 50 × 0.5 = 25 USDT-ért vesz SOL-t

  limit_price_offset_pct: "0.001"
  # LIMIT/LIMIT_MAKER esetén: ennyivel az anchor ár ALATTI áron ad limit ordert
  # 0.001 = 0.1%-kal lejjebb

fees:
  fee_mode: maker_assumed
  # maker_assumed: LIMIT_MAKER order-ekhez (standard esethez megfelelő)
  # taker_assumed: LIMIT order-ekhez ahol taker is lehetsz
  # custom:        maker_fee_buy és taker_fee_sell eltérő értékek esetén

  maker_fee_buy: "0.001"    # 0.1% – standard Binance alap díj
  maker_fee_sell: "0.001"   # BNB-vel fizetés esetén: "0.00075"
  taker_fee_buy: "0.001"
  taker_fee_sell: "0.001"
  # ▶ Hol nézd meg a te díjaidat: Binance → Felhasználói menü → Díjak

anchor:
  source: best_bid_ask_mid
  # best_bid_ask_mid (ajánlott): induláskor az aktuális bid/ask közép
  # last_trade:                  utolsó kötési ár
  # manual:                      fix ár (töltsd ki manual_price-t)
  # manual_price: "170"          # csak source: manual esetén

safety:
  external_intervention_policy: pause
  # Mi történjen ha kézzel törölsz egy ordert a Binance felületén:
  # pause:              bot szünetel (ajánlott)
  # continue_reconcile: fut tovább, megpróbál szinkronizálni
  # emergency_stop:     azonnal leáll és mindent töröl

  max_user_stream_staleness_sec: 10   # Ha 10mp-nél régebben nincs esemény → vészleállítás
  max_trading_ws_staleness_sec: 10
  cancel_retry_interval_sec: 2        # Vészleállítás: cancelAll újrapróbálás (mp)
  cancel_retry_max: 5                 # Maximum újrapróbálkozás
  emergency_stop_on_db_queue_full: true
  emergency_stop_on_balance_mismatch: true
  sell_on_emergency_stop: false       # true: piaci áron eladja a SOL-t leálláskor

database:
  # DB kapcsolati adatok (host, port, name, user, password) az .env fájlból jönnek!
  # DB_HOST, DB_PORT, DB_NAME, DB_USER, DATABASE_PASSWORD → .env fájlba
  # Itt CSAK a pool méreteket kell megadni:
  pool_min_size: 1
  pool_max_size: 10
  writer_queue_max_size: 10000

logging:
  level: INFO     # DEBUG | INFO | WARNING | ERROR
  json_format: true      # true: JSON (Docker/log aggregátor); false: olvasható szöveg
