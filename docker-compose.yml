x-bot-common: &bot-common
  build: .
  restart: unless-stopped
  env_file: .env
  networks:
    - kebo-net
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

services:

  # SOLUSDC bot – API: http://localhost:4080
  bot-solusdc:
    <<: *bot-common
    container_name: kebo-grid-solusdc
    ports:
      - "4080:8080"
    volumes:
      - ./configs/solusdc.yaml:/app/config.yaml:ro

  # SOLUSDT bot – API: http://localhost:8081
  # bot-solusdt:
  #   <<: *bot-common
  #   container_name: kebo-grid-solusdt
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./configs/solusdt.yaml:/app/config.yaml:ro

  # BTCUSDT bot – API: http://localhost:8082
  # bot-btcusdt:
  #   <<: *bot-common
  #   container_name: kebo-grid-btcusdt
  #   ports:
  #     - "8082:8080"
  #   volumes:
  #     - ./configs/btcusdt.yaml:/app/config.yaml:ro

networks:
  kebo-net:
    name: kebo-net
    driver: bridge

# ============================================================
# DB KAPCSOLAT – Docker hálózati útmutató:
#
# A bot Docker konténerből NEM éri el a 95.138.193.102 külső IP-t
# (hairpin NAT probléma ugyanazon a VPS-en).
#
# MEGOLDÁS A – DB ugyanazon a VPS-en Docker konténerben fut:
#   1. Csatlakoztasd a DB konténert a kebo-net hálózathoz:
#      docker network connect kebo-net <db-container-neve>
#   2. .env-ben: DB_HOST=<db-container-neve>
#      pl.: DB_HOST=postgres  vagy  DB_HOST=my-postgres
#
# MEGOLDÁS B – DB direktben fut a VPS-en (nem Docker):
#   .env-ben: DB_HOST=172.17.0.1
#   (172.17.0.1 a Docker bridge gateway = a host gép IP-je konténerekből)
#
# MEGOLDÁS C – DB külső szerveren van (nem ugyanazon a VPS-en):
#   .env-ben: DB_HOST=<db-szerver-külső-ip>
#   Ez működik, mert más hálózatról jön a csatlakozás.
# ============================================================
